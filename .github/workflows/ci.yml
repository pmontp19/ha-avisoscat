name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 2026-06-17

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8.2.0 2026-06-03
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv venv --python 3.13 .venv

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements_dev.txt

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Run tests with coverage
        run: |
          .venv/bin/python -m pytest tests/ \
            --cov=custom_components/avisoscat \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=95
