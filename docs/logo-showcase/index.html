        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #FAFAFA;
            color: #1A1A1A;
            overflow-x: hidden;
        }

        .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        html { scroll-behavior: smooth; }

        .logo-card { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover { transform: translateY(-4px); }

        .logo-canvas {
            border-radius: 24px;
            transition: background 0.5s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body[data-bg="light"] .logo-canvas { background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.07); }
        body[data-bg="dark"] .logo-canvas { background: #1A1A1A; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
        body[data-bg="checker"] .logo-canvas {
            background-image:
                linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%),
                linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            background-color: #fff;
        }

        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(245,158,11,0.25) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0.5);
            opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px);
            pointer-events: none;
        }

        .logo-card:hover .logo-aura { transform: scale(1); opacity: 1; }

        .divider-line {
            width: 0; height: 1px;
            background: #1A1A1A;
            opacity: 0.2;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-card:hover .divider-line { width: 100%; }

        .bg-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(0,0,0,0.15);
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .bg-btn.active { background: #1A1A1A; color: #FAFAFA; border-color: #1A1A1A; }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 999px;
        }
        .badge-rec { background: #F59E0B; color: #451A03; font-weight: 600; }
        .badge-inst { border: 1px solid rgba(69,26,3,0.35); color: #92400E; }
        .badge-captain { background: #1D4ED8; color: #EFF6FF; font-weight: 600; }
        .badge-gov { border: 1px solid rgba(29,78,216,0.45); color: #1E40AF; }

        .tracking-ultra-wide { letter-spacing: 0.2em; }
        .text-balance { text-wrap: balance; }

        .family-swatch {
            width: 14px; height: 14px; border-radius: 4px; display: inline-block;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
        }

</head>

            <section className="w-full max-w-7xl mb-32">
                <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-14">
                    <div>
                        <h2 className="text-4xl font-extralight tracking-wider">{name}</h2>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mt-3">{tagline}</p>
                    </div>
                    <div className="flex items-center gap-4">
                        <div className="flex items-center gap-2">
                            {swatches.map((c, i) => <span key={i} className="family-swatch" style={{ background: c }}></span>)}
                        </div>
                        <p className="font-mono text-[10px] opacity-50 max-w-[220px] text-right leading-relaxed">{note}</p>
                    </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16">
                    {logos.map((logo, index) => (
                        <div key={index} className="flex flex-col items-center logo-card cursor-pointer">
                            <div className="w-64 h-64 mb-10 flex items-center justify-center relative">
                                <div className="logo-aura"></div>
                                <div className="w-36 h-36 relative z-10 logo-canvas p-2">
                                    <logo.Component />
                                </div>
                            </div>
                            <div className="text-center w-full px-4">
                                <div className="flex items-center justify-center gap-2 mb-2 flex-wrap">
                                    <h3 className="text-xl font-medium tracking-wider uppercase">{logo.title}</h3>
                                    {logo.recommended && <span className="badge badge-rec">Recomanat</span>}
                                    {logo.installed && <span className="badge badge-inst">Instal·lat en aquest PR</span>}
                                    {logo.captain && <span className="badge badge-captain">Capità: iterant</span>}
                                    {logo.gov && <span className="badge badge-gov">Referència governamental</span>}
                                </div>
                                <h4 className="text-xs font-mono opacity-50 tracking-widest mb-6">{logo.subtitle}</h4>
                                <p className="text-sm leading-relaxed opacity-70 text-left font-light text-balance">{logo.philosophy}</p>
                            </div>
                            <div className="divider-line mt-8 mx-auto"></div>
                        </div>
                    ))}
                </div>
            </section>
        );

        const LogoShowcase = () => {
            const [bg, setBg] = useState("light");

            const setTheme = (mode) => {
                setBg(mode);
                document.body.dataset.bg = mode;
                document.body.style.background = mode === "dark" ? "#111111" : "#FAFAFA";
                document.body.style.color = mode === "dark" ? "#EDEDED" : "#1A1A1A";
            };

            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6">

                    {/* Header */}
                    <div className="text-center mb-10 max-w-3xl">
                        <h1 className="text-6xl md:text-7xl font-extralight tracking-wider mb-6">
                            avisoscat <span className="opacity-30 font-extralight">+</span> cecat
                        </h1>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-8">
                            Exploració de logotip · família de marques · Home Assistant
                        </p>
                        <div className="w-12 h-[1px] bg-current mx-auto opacity-30"></div>
                        <p className="mt-8 text-sm font-light opacity-60 leading-relaxed max-w-xl mx-auto text-balance">
                            Dues integracions germanes: el mateix llenguatge visual (triangles arrodonits,
                            traç gruixut, un sol color de marca) amb rols diferents. Avisoscat mira el cel
                            (ambre, perill meteo per comarca); cecat mira la resposta (blau i taronja,
                            plans de protecció civil). El capità tria; hi ha dos recomanats per família.
                        </p>
                    </div>

                    {/* Background switcher */}
                    <div className="flex items-center gap-3 mb-24">
                        <span className="font-mono text-[10px] opacity-40 uppercase tracking-ultra-wide">Fons:</span>
                        <button className={"bg-btn " + (bg === "light" ? "active" : "")} onClick={() => setTheme("light")}>Clar</button>
                        <button className={"bg-btn " + (bg === "dark" ? "active" : "")} onClick={() => setTheme("dark")}>Fosc</button>
                        <button className={"bg-btn " + (bg === "checker" ? "active" : "")} onClick={() => setTheme("checker")}>Transparència</button>
                    </div>

                    <Family
                        name="avisoscat"
                        tagline="Avisos meteorològics de la Meteocat · SMP per comarca"
                        swatches={["#F59E0B", "#B45309", "#8CA0B3"]}
                        note="Ambre SMP + àmbar profund. PNG a custom_components/avisoscat/brand/"
                        logos={avisoscat}
                    />

                    <Family
                        name="cecat"
                        tagline="Plans de protecció civil de Catalunya · INUNCAT · VENTCAT · NEUCAT"
                        swatches={["#F97316", "#2563EB", "#1E3A8A"]}
                        note="Taronja d'activació + blau institucional. PNGs candidats a docs/logo-showcase/png/cecat/"
                        logos={cecat}
                    />

                    {/* Footer */}
                    <div className="mt-16 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            Generat amb logo-generator · SVG a docs/logo-showcase/svg · 2026
                        </p>
                        <p className="mt-6 text-[11px] font-light opacity-50 leading-relaxed max-w-xl mx-auto">
                            Nota de llicència: CE8 és un homenatge adaptat a la identitat pública de Protecció
                            Civil (Generalitat de Catalunya); no és ni reprodueix el logotip oficial. La resta de
                            variants són obres originals d'aquest repositori.
                        </p>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>

</body>
</html>
