blueprint:
  name: "Avisos Meteocat — Notificació d'avís"
  description: >-
    Envia una notificació push quan la integració Avisos Meteocat emet un avís
    (`avisoscat_warning_announced`), quan un avís entra en vigor
    (`avisoscat_warning_started`), i opcionalment quan puja o baixa de grau
    (`avisoscat_warning_upgraded` / `_downgraded`), es resol
    (`avisoscat_warning_cleared`) o es dispara un nowcast de temps violent
    (`avisoscat_violent_weather`).

    Distingeix els dos horitzons del SMP (docs/03-feature-spec.md §1.1): un
    avís emès amb antelació diu "d'aquí a N h" (senyal de planificació); un
    avís que entra en vigor no diu l'antelació. El filtre `notify_on` tria
    quin dels dos senyals vols, i `max_hores_antelacio` descarta els anuncis
    massa llunyans en el temps (un avís de divendres emès dimarts).

    Consulta `docs/03-feature-spec.md` §4 i §5 del repositori per als
    payloads exactes dels events i l'especificació d'aquest blueprint.
  domain: automation
  source_url: https://github.com/pmontp19/ha-avisoscat/blob/main/blueprints/automation/avisoscat_warning_notification.yaml
  homeassistant:
    # `!input` dins de `action:`/`data:` i els blocs `choose:`/`if:` amb
    # `variables:` per pas requereixen una versió prou recent de l'schema
    # d'automations. 2024.10 és una fita conservadora (bastant per darrere
    # de qualsevol instal·lació que ja pugui fer servir aquesta integració).
    min_version: 2024.10.0
  input:
    notification_service:
      name: Servei de notificació
      description: >-
        Acció de notificació a cridar, per exemple `notify.mobile_app_el_meu_mobil`
        o `notify.notify` (grup de tots els dispositius mòbils). S'introdueix
        com a text (no com a selector d'entitat) perquè `notify.*` són
        serveis, no entitats.
      default: notify.notify
      selector:
        text: null
    meteors:
      name: Meteors
      description: >-
        Quins meteors notificar. El valor coincideix amb el camp `meteor` dels
        events (docs/03-feature-spec.md §4). Per defecte, tots.
      default:
        - vent
        - pluja_30min
        - pluja_3h
        - pluja_acumulada
        - neu
        - mar
        - fred
        - calor
        - calor_nocturna
        - temps_violent
      selector:
        select:
          mode: dropdown
          multiple: true
          options:
            - label: Vent
              value: vent
            - label: Intensitat de pluja en 30 minuts
              value: pluja_30min
            - label: Intensitat de pluja en 3 hores
              value: pluja_3h
            - label: Acumulació de pluja
              value: pluja_acumulada
            - label: Neu
              value: neu
            - label: Estat de la mar
              value: mar
            - label: Fred
              value: fred
            - label: Calor
              value: calor
            - label: Calor nocturna
              value: calor_nocturna
            - label: Temps violent
              value: temps_violent
    minimum_perill:
      name: Grau mínim
      description: >-
        Notifica només els avisos amb grau de perill igual o superior. Escala
        oficial 0–6 (docs/03-feature-spec.md §3.1); 3 correspon a "Alt".
        No s'aplica als events de resolució (`_cleared`), que porten el grau
        final en lloc del vigent.
      default: 3
      selector:
        number:
          min: 1
          max: 6
          mode: slider
    notify_on:
      name: Quan notificar
      description: >-
        `anunciat` només avisa quan l'SMC emet l'avís (amb hores o dies
        d'antelació, senyal de planificació); `en_vigor` només quan l'avís
        entra en vigor; `tots dos` envia un missatge de preparació i un altre
        d'entrada en vigor. El temps violent (nowcast) és un horitzó apart i
        es controla per separat amb "Temps violent".
      default: tots dos
      selector:
        select:
          mode: dropdown
          options:
            - label: Només anunci (planificació)
              value: anunciat
            - label: Només entrada en vigor
              value: en_vigor
            - label: Tots dos
              value: tots dos
    max_hores_antelacio:
      name: Antelació màxima (hores)
      description: >-
        Ignora els anuncis a més de N hores vista. Evita la notificació de
        dimarts per un avís de divendres. Amb 0 (per defecte), sense límit.
        Només afecta els events `announced`, que porten `hores_per_endavant`.
      default: 0
      selector:
        number:
          min: 0
          max: 168
          unit_of_measurement: h
          mode: box
    include_upgrades:
      name: Notifica canvis de grau
      description: >-
        Envia també una notificació quan un avís en vigor puja o baixa de grau
        (`avisoscat_warning_upgraded` / `_downgraded`).
      default: false
      selector:
        boolean: null
    include_cleared:
      name: Notifica resolucions
      description: >-
        Envia també una notificació quan un avís en vigor es resol
        (`avisoscat_warning_cleared`).
      default: false
      selector:
        boolean: null
    include_violent_weather:
      name: Temps violent
      description: >-
        Notifica els nowcasts de temps violent (`avisoscat_violent_weather`),
        l'únic horitzó de minuts del SMP. Independent de "Quan notificar" perquè
        el temps violent no té fase d'anunci.
      default: true
      selector:
        boolean: null
    critical_alert:
      name: Alerta crítica
      description: >-
        Marca la notificació com a crítica perquè sigui audible fins i tot
        amb el mode "no molestar" activat. A iOS cal tenir activat el permís
        de "Critical Alerts" per a l'app de Home Assistant. A Android cal
        haver creat prèviament (una sola vegada, des de l'app) un canal de
        notificació anomenat `alarm_stream` amb importància alta i so propi
        — un cop creat, Android no permet canviar-ne la importància per codi.
        Recomanat només per al temps violent.
      default: false
      selector:
        boolean: null

# Diversos avisos poden entrar en vigor a la mateixa transició de franja de
# 6 h; cada disparo es processa de manera independent (mode en cua) en lloc
# de cancel·lar l'anterior.
mode: queued
max: 10

# Els disparadors d'un blueprint no es poden condicionar (no hi ha manera de
# fer servir `!input notify_on` dins d'un `trigger`), així que sempre es
# dispara pels 6 events i tot el filtratge (notify_on + booleans + meteor +
# grau + antelació) es fa dins de `actions` amb `choose`/`if`.
triggers:
  - trigger: event
    event_type: avisoscat_warning_announced
    id: announced
  - trigger: event
    event_type: avisoscat_warning_started
    id: started
  - trigger: event
    event_type: avisoscat_warning_upgraded
    id: upgraded
  - trigger: event
    event_type: avisoscat_warning_downgraded
    id: downgraded
  - trigger: event
    event_type: avisoscat_warning_cleared
    id: cleared
  - trigger: event
    event_type: avisoscat_violent_weather
    id: violent

variables:
  notification_service: !input notification_service
  meteors: !input meteors
  minimum_perill: !input minimum_perill
  notify_on: !input notify_on
  max_hores_antelacio: !input max_hores_antelacio
  include_upgrades: !input include_upgrades
  include_cleared: !input include_cleared
  include_violent_weather: !input include_violent_weather
  critical_alert: !input critical_alert
  # Els dos horitzons es seleccionen aquí; cada branca `choose` comprova el
  # que li correspon.
  want_announced: "{{ notify_on in ['anunciat', 'tots dos'] }}"
  want_in_force: "{{ notify_on in ['en_vigor', 'tots dos'] }}"
  # Grau de perill (text de l'enum) a text llegible, i etiqueta del dia.
  nivell_text_map:
    moderat: "moderat"
    alt: "alt"
    molt_alt: "molt alt"
  dia_text:
    avui: "avui"
    dema: "demà"
    dema_passat: "demà passat"
  meteor_emoji:
    vent: "💨"
    pluja_30min: "🌧️"
    pluja_3h: "🌧️"
    pluja_acumulada: "💧"
    neu: "❄️"
    mar: "🌊"
    fred: "🥶"
    calor: "🥵"
    calor_nocturna: "🌙"
    temps_violent: "🌩️"
  meteocat_url: "https://www.meteo.cat/observacions/radar"

actions:
  - choose:
      # ---------------------------------------------------------------
      # avisoscat_warning_announced — l'SMC emet/amplia un avís futur.
      # Filtra per meteor, grau mínim i antelació màxima. El text porta
      # "d'aquí a N h" per distingir-lo de l'entrada en vigor.
      # ---------------------------------------------------------------
      - conditions: "{{ trigger.id == 'announced' and want_announced }}"
        sequence:
          - variables:
              d_meteor: "{{ trigger.event.data.meteor }}"
              d_meteor_nom: "{{ trigger.event.data.meteor_nom }}"
              d_perill: "{{ trigger.event.data.perill | int(0) }}"
              d_nivell_text: "{{ trigger.event.data.nivell_text }}"
              d_hores: "{{ trigger.event.data.hores_per_endavant | int(0) }}"
              d_dia: "{{ trigger.event.data.dia }}"
              d_periode: "{{ trigger.event.data.periode }}"
              d_llindar: "{{ trigger.event.data.llindar }}"
          - variables:
              passes_meteor: "{{ d_meteor in meteors }}"
              passes_perill: "{{ d_perill >= (minimum_perill | int(0)) }}"
              passes_antelacio: >-
                {{ (max_hores_antelacio | int(0)) == 0
                   or d_hores <= (max_hores_antelacio | int(0)) }}
          - if:
              - condition: template
                value_template: "{{ passes_meteor and passes_perill and passes_antelacio }}"
            then:
              - variables:
                  notify_title: >-
                    {{ meteor_emoji.get(d_meteor, '📢') }} Avís de {{ d_meteor_nom }} {{ nivell_text_map.get(d_nivell_text, d_nivell_text) }} d'aquí a {{ d_hores }} h
                  notify_message: >-
                    Perill {{ d_perill }}/6 · {{ dia_text.get(d_dia, d_dia) }}, franja {{ d_periode }} · {{ d_llindar }}
                  notify_data: >-
                    {% set base = {'actions': [{'action': 'URI', 'title': 'Veure a meteo.cat', 'uri': meteocat_url}]} %}
                    {% if critical_alert %}
                      {% set base = dict(base, notification_id='avisoscat_announced_' ~ d_meteor, push={'interruption-level': 'critical', 'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}, priority='high', ttl=0, channel='alarm_stream', importance='high') %}
                    {% endif %}
                    {{ base }}
              - action: !input notification_service
                data:
                  title: "{{ notify_title | trim }}"
                  message: "{{ notify_message | trim }}"
                  data: "{{ notify_data }}"

      # ---------------------------------------------------------------
      # avisoscat_warning_started — l'avís entra en vigor ara. Filtra per
      # meteor i grau mínim. Sense text d'antelació (ja és en vigor).
      # ---------------------------------------------------------------
      - conditions: "{{ trigger.id == 'started' and want_in_force }}"
        sequence:
          - variables:
              d_meteor: "{{ trigger.event.data.meteor }}"
              d_meteor_nom: "{{ trigger.event.data.meteor_nom }}"
              d_perill: "{{ trigger.event.data.perill | int(0) }}"
              d_nivell_text: "{{ trigger.event.data.nivell_text }}"
              d_periode: "{{ trigger.event.data.periode }}"
              d_llindar: "{{ trigger.event.data.llindar }}"
          - variables:
              passes_meteor: "{{ d_meteor in meteors }}"
              passes_perill: "{{ d_perill >= (minimum_perill | int(0)) }}"
          - if:
              - condition: template
                value_template: "{{ passes_meteor and passes_perill }}"
            then:
              - variables:
                  notify_title: >-
                    {{ meteor_emoji.get(d_meteor, '🔴') }} En vigor: avís de {{ d_meteor_nom }} {{ nivell_text_map.get(d_nivell_text, d_nivell_text) }}
                  notify_message: >-
                    Perill {{ d_perill }}/6 · franja {{ d_periode }} · {{ d_llindar }}
                  notify_data: >-
                    {% set base = {'actions': [{'action': 'URI', 'title': 'Veure a meteo.cat', 'uri': meteocat_url}]} %}
                    {% if critical_alert %}
                      {% set base = dict(base, notification_id='avisoscat_started_' ~ d_meteor, push={'interruption-level': 'critical', 'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}, priority='high', ttl=0, channel='alarm_stream', importance='high') %}
                    {% endif %}
                    {{ base }}
              - action: !input notification_service
                data:
                  title: "{{ notify_title | trim }}"
                  message: "{{ notify_message | trim }}"
                  data: "{{ notify_data }}"

      # ---------------------------------------------------------------
      # avisoscat_warning_upgraded / _downgraded — només si
      # include_upgrades. El payload porta perill_anterior i perill.
      # ---------------------------------------------------------------
      - conditions: >-
          {{ trigger.id in ['upgraded', 'downgraded'] and want_in_force and include_upgrades }}
        sequence:
          - variables:
              d_meteor: "{{ trigger.event.data.meteor }}"
              d_perill: "{{ trigger.event.data.perill | int(0) }}"
              d_perill_anterior: "{{ trigger.event.data.perill_anterior | int(0) }}"
              d_nivell_text: "{{ trigger.event.data.nivell_text }}"
              d_periode: "{{ trigger.event.data.periode }}"
              d_llindar: "{{ trigger.event.data.llindar }}"
              d_fletxa: "{{ '⬆️' if trigger.id == 'upgraded' else '⬇️' }}"
          - variables:
              passes_meteor: "{{ d_meteor in meteors }}"
              passes_perill: "{{ d_perill >= (minimum_perill | int(0)) }}"
          - if:
              - condition: template
                value_template: "{{ passes_meteor and passes_perill }}"
            then:
              - variables:
                  notify_title: >-
                    {{ d_fletxa }} Avís de {{ d_meteor }} canvia a {{ nivell_text_map.get(d_nivell_text, d_nivell_text) }}
                  notify_message: >-
                    Perill {{ d_perill_anterior }} → {{ d_perill }}/6 · franja {{ d_periode }} · {{ d_llindar }}
                  notify_data: >-
                    {% set base = {'actions': [{'action': 'URI', 'title': 'Veure a meteo.cat', 'uri': meteocat_url}]} %}
                    {% if critical_alert %}
                      {% set base = dict(base, notification_id='avisoscat_' ~ trigger.id ~ '_' ~ d_meteor, push={'interruption-level': 'critical', 'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}, priority='high', ttl=0, channel='alarm_stream', importance='high') %}
                    {% endif %}
                    {{ base }}
              - action: !input notification_service
                data:
                  title: "{{ notify_title | trim }}"
                  message: "{{ notify_message | trim }}"
                  data: "{{ notify_data }}"

      # ---------------------------------------------------------------
      # avisoscat_warning_cleared — només si include_cleared. No porta
      # grau vigent (porta perill_final), així que no s'aplica el filtre
      # de grau mínim, només el de meteor.
      # ---------------------------------------------------------------
      - conditions: "{{ trigger.id == 'cleared' and want_in_force and include_cleared }}"
        sequence:
          - variables:
              d_meteor: "{{ trigger.event.data.meteor }}"
              d_perill_final: "{{ trigger.event.data.perill_final | int(0) }}"
              d_durada_min: "{{ trigger.event.data.durada_min | int(0) }}"
              d_motiu: "{{ trigger.event.data.motiu }}"
          - variables:
              passes_meteor: "{{ d_meteor in meteors }}"
          - if:
              - condition: template
                value_template: "{{ passes_meteor }}"
            then:
              - variables:
                  notify_title: >-
                    ✅ Resolt: avís de {{ d_meteor }}
                  notify_message: >-
                    Perill final {{ d_perill_final }}/6 · durada {{ d_durada_min }} min · {{ d_motiu }}
                  notify_data: >-
                    {% set base = {'actions': [{'action': 'URI', 'title': 'Veure a meteo.cat', 'uri': meteocat_url}]} %}
                    {% if critical_alert %}
                      {% set base = dict(base, notification_id='avisoscat_cleared_' ~ d_meteor, push={'interruption-level': 'critical', 'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}, priority='high', ttl=0, channel='alarm_stream', importance='high') %}
                    {% endif %}
                    {{ base }}
              - action: !input notification_service
                data:
                  title: "{{ notify_title | trim }}"
                  message: "{{ notify_message | trim }}"
                  data: "{{ notify_data }}"

      # ---------------------------------------------------------------
      # avisoscat_violent_weather — nowcast de minuts, horitzó apart.
      # Independent de notify_on (no té fase d'anunci). El payload no
      # porta `meteor` ni `perill`, així que no s'apliquen aquests filtres.
      # ---------------------------------------------------------------
      - conditions: "{{ trigger.id == 'violent' and include_violent_weather }}"
        sequence:
          - variables:
              d_probabilitat: "{{ trigger.event.data.probabilitat }}"
              d_llindar: "{{ trigger.event.data.llindar }}"
              d_valid_fins: "{{ trigger.event.data.valid_fins }}"
          - variables:
              notify_title: >-
                🌩️ TEMPS VIOLENT — probabilitat {{ d_probabilitat }}
              notify_message: >-
                {{ d_llindar }} · vàlid fins {{ d_valid_fins }}
              notify_data: >-
                {% set base = {'actions': [{'action': 'URI', 'title': 'Veure a meteo.cat', 'uri': meteocat_url}]} %}
                {% if critical_alert %}
                  {% set base = dict(base, notification_id='avisoscat_violent', push={'interruption-level': 'critical', 'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}, priority='high', ttl=0, channel='alarm_stream', importance='high') %}
                {% endif %}
                {{ base }}
          - action: !input notification_service
            data:
              title: "{{ notify_title | trim }}"
              message: "{{ notify_message | trim }}"
              data: "{{ notify_data }}"
